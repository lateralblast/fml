# Builds the installers on GitHub's runners, for `./build.sh --target <t> --ci`. Started by hand (or by that
# command) for the branch it names: the commit at its tip is built and the files in dist/ are kept as an artifact
# of the run, which the command downloads. Nothing is signed, tagged, pushed or published here.
#
#   linux    ubuntu: the installer for the distribution (deb, plus rpm and AppImage with `package`), and fml-cli
#   mac      macOS: the .dmg and fml-cli for `arch` (arm64, x64 or universal; blank is the runner's own)
#   windows  Windows (Git Bash): the NSIS installer and fml-cli.exe, built on Windows itself (untested until run)
#   windows tests  on Windows: cargo test for the Rust workspace. Informational: it never fails the run, so the
#                  results can be read before the pytest suite (which needs bash stand-in tools) is run there too

name: Build

on:
  workflow_dispatch:
    inputs:
      target:
        description: "What to build"
        type: choice
        options: [linux, mac, windows]
        default: linux
        required: true
      package:
        description: "linux only: deb, rpm, appimage or all (blank: the runner's own package, deb)"
        type: string
        default: ""
      arch:
        description: "mac only: arm64, x64 or universal (blank: the runner's own)"
        type: string
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    if: inputs.target == 'linux'
    name: linux installer
    runs-on: ubuntu-latest
    env:
      PACKAGE: ${{ inputs.package }}
    steps:
      - uses: actions/checkout@v4
      - name: Install what the app and the packages need
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev rpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Install tauri-cli
        run: cargo install tauri-cli --version '^2' --locked
      - name: Build
        run: ./build.sh --target linux ${PACKAGE:+--package "$PACKAGE"}
      - uses: actions/upload-artifact@v4
        with:
          name: fml-linux
          path: dist/*
          if-no-files-found: error

  mac:
    if: inputs.target == 'mac'
    name: mac installer
    runs-on: macos-latest
    env:
      ARCH: ${{ inputs.arch }}
      # signing and notarising happen only when these secrets are set; without them the build is unsigned
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Install tauri-cli
        run: cargo install tauri-cli --version '^2' --locked
      - name: Import the Developer ID certificate into a temporary keychain
        if: env.APPLE_CERTIFICATE != '' && env.APPLE_CERTIFICATE_PASSWORD != ''
        env:
          SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
        run: |
          keychain="$RUNNER_TEMP/build.keychain-db"
          keychain_password=$(uuidgen)
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/certificate.p12"
          [ -z "$SIGNING_IDENTITY" ] || echo "APPLE_SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"
      - name: Write the notarisation key
        if: env.APPLE_API_KEY_P8 != '' && vars.APPLE_API_KEY != ''
        env:
          KEY_ID: ${{ vars.APPLE_API_KEY }}
          ISSUER: ${{ vars.APPLE_API_ISSUER }}
        run: |
          key="$RUNNER_TEMP/AuthKey_${KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$key"
          chmod 600 "$key"
          {
            echo "APPLE_API_KEY=$KEY_ID"
            echo "APPLE_API_KEY_PATH=$key"
            [ -z "$ISSUER" ] || echo "APPLE_API_ISSUER=$ISSUER"
          } >> "$GITHUB_ENV"
      - name: Build
        run: ./build.sh --target mac ${ARCH:+--arch "$ARCH"}
      - name: Notarise, staple and check the disk image
        # the app inside is notarised by the build; the disk image needs its own submission and ticket
        if: env.APPLE_API_KEY_PATH != '' && env.APPLE_API_ISSUER != ''
        run: |
          shopt -s nullglob
          dmgs=(dist/*.dmg)
          [ "${#dmgs[@]}" -eq 1 ] || { echo "expected one .dmg in dist/, found ${#dmgs[@]}" >&2; exit 1; }
          dmg="${dmgs[0]}"
          xcrun notarytool submit "$dmg" --key-id "$APPLE_API_KEY" --key "$APPLE_API_KEY_PATH" --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl -a -vvv -t install "$dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: fml-mac
          path: dist/*
          if-no-files-found: error

  windows:
    if: inputs.target == 'windows'
    name: windows installer
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Install tauri-cli
        run: cargo install tauri-cli --version '^2' --locked
      - name: Build
        run: ./build.sh --target windows
      - uses: actions/upload-artifact@v4
        with:
          name: fml-windows
          path: dist/*
          if-no-files-found: error

  windows-tests:
    if: inputs.target == 'windows'
    name: windows tests (informational)
    runs-on: windows-latest
    continue-on-error: true
    defaults:
      run:
        shell: bash
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: cargo test
        run: cargo test --workspace --locked
