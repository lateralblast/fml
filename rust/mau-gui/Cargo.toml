[package]
name = "mau-gui"
description = "Desktop front end for mau (Tauri)"
version.workspace = true
edition.workspace = true
# Tauri and its dependencies need a newer Rust than the command line tool
rust-version = "1.90"
license.workspace = true
authors.workspace = true

[[bin]]
name = "mau"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mau-core = { path = "../mau-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSData", "NSError", "NSString", "NSURL"] }

[features]
# the build without mkvtoolnix (see mau-core)
no-mkvtoolnix = ["mau-core/no-mkvtoolnix"]
native-mkv = ["mau-core/native-mkv"]
native-mp4 = ["mau-core/native-mp4"]
native-avi = ["mau-core/native-avi"]
native-detect = ["mau-core/native-detect"]
