[workspace]
resolver = "2"
members = ["mau-core", "mau-cli", "mau-gui"]
# a plain `cargo build` leaves the GUI out: it needs the system webview libraries
default-members = ["mau-core", "mau-cli"]

[workspace.package]
version = "1.6.1"
edition = "2021"
license = "Apache-2.0"
authors = ["Richard Spindler <richard@lateralblast.com.au>"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
libc = "0.2"
unicode-normalization = "0.1"
