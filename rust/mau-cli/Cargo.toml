[package]
name = "mau-cli"
description = "Command line front end for mau"
version.workspace = true
edition.workspace = true
rust-version = "1.85"
license.workspace = true
authors.workspace = true

[[bin]]
name = "mau-cli"
path = "src/main.rs"

[dependencies]
mau-core = { path = "../mau-core" }
clap.workspace = true
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[features]
# the build without mkvtoolnix (see mau-core)
no-mkvtoolnix = ["mau-core/no-mkvtoolnix"]
# the MKV tracks are read in this program, not with ffprobe (see mau-core)
native-mkv = ["mau-core/native-mkv"]
native-mp4 = ["mau-core/native-mp4"]
native-avi = ["mau-core/native-avi"]
native-detect = ["mau-core/native-detect"]
