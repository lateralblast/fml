[package]
name = "fml-gui"
description = "Desktop front end for fml (Tauri)"
version.workspace = true
edition.workspace = true
# Tauri and its dependencies need a newer Rust than the command line tool
rust-version = "1.90"
license.workspace = true
authors.workspace = true

[[bin]]
name = "fml"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
fml-core = { path = "../fml-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde.workspace = true
serde_json.workspace = true
